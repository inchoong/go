<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>智能配色原生JS轮播图</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }

    .carousel-container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55); /* 更柔和的缓动 */
    }

    .carousel-slide {
      min-width: 100%;
      height: 450px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* 柔化遮罩层：统一背景对比度 */
    .carousel-slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.6));
      opacity: 0.85;
      z-index: 1;
      transition: opacity 0.5s ease;
    }

    .slide-content {
      position: relative;
      z-index: 2;
      max-width: 80%;
      padding: 20px;
    }

    /* 默认深色背景下的文字样式 */
    .slide-title {
      font-size: 2.2rem;
      font-weight: 600;
      color: white;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.5),
        0 1px 1px rgba(0, 0, 0, 0.3);
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .slide-link {
      display: inline-block;
      padding: 0.8em 1.6em;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .slide-link:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* 浅色背景下的文字样式 */
    .carousel-slide.light-bg .slide-title {
      color: #333;
      text-shadow: 
        0 2px 4px rgba(255, 255, 255, 0.8),
        0 1px 1px rgba(255, 255, 255, 0.5);
    }

    .carousel-slide.light-bg .slide-link {
      background: rgba(0, 0, 0, 0.15);
      color: #333;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    .carousel-slide.light-bg .slide-link:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    /* 左右箭头 */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 50%;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .carousel-arrow:hover {
      opacity: 1;
      background: rgba(0,0,0,0.7);
      transform: translateY(-50%) scale(1.1);
    }

    .arrow-left {
      left: 15px;
    }

    .arrow-right {
      right: 15px;
    }

    /* 指示器 */
    .carousel-indicators {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .indicator.active {
      background: white;
      transform: scale(1.2);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .carousel-slide {
        height: 300px;
      }
      .slide-title {
        font-size: 1.6rem;
      }
      .slide-link {
        font-size: 1rem;
        padding: 0.6em 1.3em;
      }
      .carousel-arrow {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      .arrow-left { left: 10px; }
      .arrow-right { right: 10px; }
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <!-- Slides will be inserted here by JS -->
    </div>

    <button class="carousel-arrow arrow-left" id="prevBtn">&lt;</button>
    <button class="carousel-arrow arrow-right" id="nextBtn">&gt;</button>

    <div class="carousel-indicators" id="indicators">
      <!-- Indicators will be inserted here by JS -->
    </div>
  </div>

  <script>
    // 轮播图数据
    const slidesData = [
      { image: 'https://www.evoote.com/wp-content/uploads/2023/06/20230610090246-64843c360cdaf.jpg', title: '校园风光 · 春日樱花', desc: '春风十里，不如校园的你' },
      { image: 'https://www.evoote.com/wp-content/uploads/2023/06/20230610090246-64843c36c9ffc.jpg', title: '学术报告 · 科技前沿', desc: '院士讲座，启迪智慧' },
      { image: 'https://www.evoote.com/wp-content/uploads/2023/06/20230610090247-64843c37c1a12.jpg', title: '社团活动 · 青春飞扬', desc: '多彩社团，展现自我' },
      { image: 'https://www.evoote.com/wp-content/uploads/2023/06/20230610090245-64843c35e062a.jpg', title: '实验室 · 实践创新', desc: '动手实验，探索未知' },
      { image: '17553037581602176.jpg', title: '实验室 · 实践创新', desc: '动手实验，探索未知' },
    ];

    const track = document.getElementById('carouselTrack');
    const indicatorsContainer = document.getElementById('indicators');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = 0;
    const totalSlides = slidesData.length;
    const autoPlayInterval = 5000; // 5秒
    let autoPlayTimer;

    // 创建幻灯片和指示器
    function initCarousel() {
        slidesData.forEach((data, index) => {
            // 创建幻灯片
            const slide = document.createElement('div');
            slide.className = 'carousel-slide';
            slide.style.backgroundImage = `url(${data.image})`;
            slide.dataset.index = index; // 用于亮度分析

            slide.innerHTML = `
                <div class="slide-content">
                    <h2 class="slide-title">${data.title}</h2>
                    <a href="#" class="slide-link">了解更多</a>
                </div>
            `;
            track.appendChild(slide);

            // 创建指示器
            const dot = document.createElement('div');
            dot.className = 'indicator';
            dot.dataset.index = index;
            dot.addEventListener('click', () => goToSlide(index));
            indicatorsContainer.appendChild(dot);
        });

        updateCarousel();
        startAutoPlay();

        // 绑定箭头事件
        prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
        nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

        // 鼠标悬停暂停
        const container = document.querySelector('.carousel-container');
        container.addEventListener('mouseenter', stopAutoPlay);
        container.addEventListener('mouseleave', startAutoPlay);

        // 分析所有图片亮度
        analyzeAllImagesBrightness();
    }

    function updateCarousel() {
        const offset = -currentIndex * 100;
        track.style.transform = `translateX(${offset}%)`;
        updateIndicators();
    }

    function updateIndicators() {
        document.querySelectorAll('.indicator').forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
    }

    function goToSlide(index) {
        if (index < 0) {
            currentIndex = totalSlides - 1;
        } else if (index >= totalSlides) {
            currentIndex = 0;
        } else {
            currentIndex = index;
        }
        updateCarousel();
        resetAutoPlay();
    }

    function nextSlide() {
        goToSlide(currentIndex + 1);
    }

    function startAutoPlay() {
        autoPlayTimer = setInterval(nextSlide, autoPlayInterval);
    }

    function stopAutoPlay() {
        clearInterval(autoPlayTimer);
    }

    function resetAutoPlay() {
        stopAutoPlay();
        startAutoPlay();
    }

    // --- 智能配色核心逻辑 ---
    function analyzeAllImagesBrightness() {
        const slides = document.querySelectorAll('.carousel-slide');
        slides.forEach(slide => {
            const imgSrc = slide.style.backgroundImage.slice(4, -1).replace(/"/g, "");
            getAverageColor(imgSrc).then(averageColor => {
                const brightness = (averageColor.r * 299 + averageColor.g * 587 + averageColor.b * 114) / 1000;
                if (brightness > 180) { // 阈值可调
                    slide.classList.add('light-bg');
                }
            });
        });
    }

    // 使用Canvas获取图片主色调
    function getAverageColor(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = "Anonymous"; // 处理跨域问题
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1; // 缩小到1x1像素以获取平均色
                canvas.height = 1;
                ctx.drawImage(img, 0, 0, 1, 1);
                const imageData = ctx.getImageData(0, 0, 1, 1).data;
                resolve({ r: imageData[0], g: imageData[1], b: imageData[2] });
            };
            img.onerror = reject;
            img.src = src;
        });
    }

    // 启动轮播图
    window.addEventListener('DOMContentLoaded', initCarousel);
  </script>

</body>
</html>

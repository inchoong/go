<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信支付摇一摇有优惠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        
        .wechat-article {
            width: 100%;
            max-width: 600px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            padding: 20px 15px;
        }
        
        .article-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #000;
        }
        
        .account-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 2px;
            margin-right: 8px;
            background: #07c160;
        }
        
        .account-name {
            font-size: 14px;
            color: #576b95;
            font-weight: 500;
        }
        
        .publish-time {
            font-size: 14px;
            color: #999;
            margin-left: auto;
        }
        
        .article-content {
            font-size: 17px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
        }
        
        .article-content p {
            margin-bottom: 20px;
            text-align: justify;
        }
        
        .interaction-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-top: 1px solid #f0f0f0;
            color: #999;
            font-size: 14px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
        }
        
        .action-button {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-button i {
            font-size: 16px;
        }
        
        .read-count {
            font-size: 14px;
            color: #999;
        }
        
        .wechat-tip {
            text-align: center;
            font-size: 14px;
            color: #999;
            padding: 15px 0;
            border-top: 1px solid #f0f0f0;
            margin-top: 20px;
        }
        
        .from-collection {
            background-color: #f8f8f8;
            padding: 12px 15px;
            border-radius: 4px;
            margin: 20px 0;
            font-size: 14px;
            color: #999;
            border-left: 3px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="wechat-article">
        <h1 class="article-title">微信支付摇一摇有优惠</h1>
        
        <div class="account-info">
            <div class="avatar"></div>
            <div class="account-name">乐哥创事记</div>
            <div class="publish-time">昨天</div>
        </div>
        
        <div class="article-content">
            <p>微信支付近日推出了"摇一摇有优惠"活动，用户在使用微信支付后，可以通过摇一摇手机获得各种优惠券和红包奖励。</p>
            
            <p>活动期间，用户只需在完成支付后摇动手机，即有机会获得不同面额的优惠券，这些优惠券可在下次支付时使用。此外，用户还可以将获得的优惠券分享给好友，增强社交互动性。</p>
            
            <p>此次活动是微信支付为了提升用户粘性和支付频率推出的新尝试，结合了移动支付和趣味互动，为用户带来更多支付乐趣。</p>
        </div>
        
        <div class="from-collection">
            来自微信收藏
        </div>
        
        <div class="interaction-bar">
            <div class="action-buttons">
                <div class="action-button">
                    <i>👍</i>
                    <span>赞</span>
                </div>
                <div class="action-button">
                    <i>↗</i>
                    <span>分享</span>
                </div>
                <div class="action-button">
                    <i>⭐</i>
                    <span>推荐</span>
                </div>
                <div class="action-button">
                    <i>✎</i>
                    <span>写留言</span>
                </div>
            </div>
            <div class="read-count">阅读 10万+</div>
        </div>
        
        <div class="wechat-tip">
            微信扫一扫关注该公众号
        </div>
    </div>
</body>
</html>

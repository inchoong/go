<!-- 2026年8月18日凌晨最新版本-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键复制 & 实时编辑 Hosts 工具 - 乐哥创事记</title>
    <!-- 引入 FLV.js 与 HLS.js 播放库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(10, 20, 28, 0.75);
            --border-color: rgba(0, 255, 102, 0.25);
            --primary-neon: #00ff66; /* 黑客帝国经典绿 */
            --secondary-neon: #00f0ff; /* 青蓝辅助色 */
            --live-red: #ff0055;
            --text-main: #f0f4f8;
            --text-sub: #8aa3ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 黑客帝国 Canvas 全屏背景 */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
        }

        /* 左右布局大容器 */
        .container {
            display: flex;
            flex-direction: row;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            min-height: 650px;
            z-index: 1;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
        }

        /* 通用卡片科技感玻璃拟态样式 */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-neon), transparent);
        }

        /* ================= 左侧：主播卡片 ================= */
        .streamer-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 420px;
        }

        @media (max-width: 900px) {
            .streamer-card {
                max-width: 100%;
            }
        }

        .profile-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
        }

        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
            width: 96px;
            height: 96px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .live-badge {
            position: absolute;
            top: -6px;
            left: -6px;
            background: var(--live-red);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
            letter-spacing: 1px;
        }

        .breath-dot {
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            animation: breath 1.2s infinite ease-in-out;
        }

        @keyframes breath {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        .profile-info h3 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }

        .profile-info p {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            font-size: 11px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--primary-neon);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        /* ================= 直播/多媒体播放器样式 ================= */
        .live-player-box {
            margin-top: 16px;
            background: rgba(0, 10, 18, 0.85);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 12px;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .player-title {
            font-size: 12px;
            color: var(--primary-neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toggle-config-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: var(--secondary-neon);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-config-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--secondary-neon);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .player-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 统一的音频播放全景卡片容器 */
        .audio-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 16px;
            background: radial-gradient(circle, rgba(0,255,102,0.08) 0%, rgba(5,8,17,0.95) 100%);
        }

        .audio-container audio {
            width: 90%;
            outline: none;
            filter: invert(0.9) hue-rotate(80deg); /* 适配黑客绿科技主题 */
        }

        /* 音频频谱/波普组件动画 */
        .spectrum-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 36px;
            width: 100%;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 255, 102, 0.2);
            border-radius: 6px;
            padding: 6px 12px;
        }

        .audio-spectrum-bar-box {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            height: 50px;
            width: 80%;
        }

        .spectrum-bar {
            flex: 1;
            max-width: 8px;
            background: linear-gradient(to top, var(--primary-neon), var(--secondary-neon));
            border-radius: 2px;
            height: 15%;
            animation: spectrumPulse 1.2s ease-in-out infinite alternate;
        }

        .spectrum-bar:nth-child(1)  { animation-delay: 0.1s; animation-duration: 0.8s; }
        .spectrum-bar:nth-child(2)  { animation-delay: 0.4s; animation-duration: 1.1s; }
        .spectrum-bar:nth-child(3)  { animation-delay: 0.2s; animation-duration: 0.9s; }
        .spectrum-bar:nth-child(4)  { animation-delay: 0.6s; animation-duration: 1.3s; }
        .spectrum-bar:nth-child(5)  { animation-delay: 0.3s; animation-duration: 0.7s; }
        .spectrum-bar:nth-child(6)  { animation-delay: 0.5s; animation-duration: 1.0s; }
        .spectrum-bar:nth-child(7)  { animation-delay: 0.2s; animation-duration: 1.2s; }
        .spectrum-bar:nth-child(8)  { animation-delay: 0.7s; animation-duration: 0.8s; }
        .spectrum-bar:nth-child(9)  { animation-delay: 0.1s; animation-duration: 1.1s; }
        .spectrum-bar:nth-child(10) { animation-delay: 0.4s; animation-duration: 0.9s; }

        @keyframes spectrumPulse {
            0% { height: 10%; opacity: 0.3; }
            100% { height: 100%; opacity: 1; }
        }

        .player-controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 11px;
            transition: all 0.4s ease-in-out;
            overflow: hidden;
        }

        .player-controls.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            padding: 0;
            pointer-events: none;
        }

        .player-controls.expanded {
            max-height: 300px;
            opacity: 1;
        }

        .control-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .control-row label {
            color: var(--text-sub);
            width: 50px;
            flex-shrink: 0;
        }

        .control-input, .control-select {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 102, 0.25);
            border-radius: 4px;
            color: var(--primary-neon);
            padding: 4px 8px;
            font-size: 11px;
            outline: none;
            font-family: monospace;
        }

        .control-input:focus, .control-select:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
        }

        .apply-btn {
            background: linear-gradient(135deg, rgba(0,255,102,0.2) 0%, rgba(0,240,255,0.2) 100%);
            border: 1px solid var(--primary-neon);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .apply-btn:hover {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .status-bar {
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .real-time-clock {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(0, 255, 102, 0.2);
        }

        .clock-date {
            font-size: 12px;
            color: var(--secondary-neon);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .clock-time {
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-neon);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .status-header {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .countdown-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: bold;
            color: var(--secondary-neon);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .is-offday {
            color: var(--live-red) !important;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4) !important;
        }

        /* ================= 右侧：Hosts 工具 ================= */
        .hosts-card {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .hosts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .hosts-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-neon);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }

        .hosts-tab-group {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 102, 0.15);
            margin-bottom: 12px;
        }

        .hosts-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
        }

        .hosts-tab-btn.active {
            background: rgba(0, 255, 102, 0.2);
            color: var(--primary-neon);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }

        .hosts-tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .platform-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: thin;
        }

        .platform-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .platform-btn.active, .platform-btn:hover {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--primary-neon);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .guide-box {
            background: rgba(0, 255, 102, 0.03);
            border-left: 3px solid var(--primary-neon);
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .guide-box code {
            color: var(--primary-neon);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .ip-query-bar {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(0, 255, 102, 0.15);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ip-query-title {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dns-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 60px;
            overflow-y: auto;
        }

        .bgp-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--secondary-neon);
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 3px 8px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .bgp-link-btn:hover {
            background: var(--secondary-neon);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .hosts-editor {
            flex: 1;
            width: 100%;
            background: rgba(3, 8, 12, 0.85);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 8px;
            padding: 14px;
            font-family: 'Consolas', 'Fira Code', Monaco, monospace;
            font-size: 12px;
            color: #00ff66;
            line-height: 1.5;
            resize: vertical;
            min-height: 200px;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .hosts-editor:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.25);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .copy-btn {
            flex: 2;
            background: linear-gradient(135deg, #00ff66 0%, #0088ff 100%);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .reset-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-sub);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: rgba(255, 0, 85, 0.2);
            border-color: var(--live-red);
            color: #fff;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .beta-link {
            background: #e74c3c;
            color: white;
            padding: 1.5px 8px;
            border-radius: 12px;
            font-size: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .beta-link:hover {
            background: #c0392b;
        }
				
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 32px;
            line-height: 32px;
            background: rgba(0, 20, 0, 0.95);
            border-top: 1px solid #00ff00;
            text-align: center;
            color: white;
            font-size: 13px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- 黑客帝国代码雨 Canvas 背景 -->
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <!-- 左侧：主播推荐卡片 -->
        <div class="glass-card streamer-card">
            <div>
                <div style="font-size: 12px; color: var(--primary-neon); letter-spacing: 1px; margin-bottom: 12px;">/// RECOMMENDED STREAMER</div>
                
                <div class="profile-container">
                    <div class="avatar-wrapper">
                        <div class="live-badge">
                            <span class="breath-dot"></span>
                            LIVE

        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const matrixChars = "ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ1234567890ABCDEFGHJKLMNPQRSTUVWXYZ";
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        initDrops();
        window.addEventListener('resize', initDrops);

        function drawMatrix() {
            ctx.fillStyle = "rgba(5, 8, 17, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                if (Math.random() > 0.85) {
                    ctx.fillStyle = "#ffffff";
                } else if (Math.random() > 0.5) {
                    ctx.fillStyle = "#00ff66";
                } else {
                    ctx.fillStyle = "#00b347";
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        function updateClockAndCountdown() {
            const now = new Date();
            
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            let dateStr = now.toLocaleDateString('zh-CN', dateOptions);
            dateStr = dateStr.replace(/星期(.?)/, '（周$1）');
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
        
            document.getElementById('clock-date').innerText = dateStr;
            document.getElementById('clock-time').innerText = timeStr;
        
            const dayOfWeek = now.getDay();
            const statusLabel = document.getElementById('status-label');
            const timerDisplay = document.getElementById('countdown-timer');
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        
            if (isWeekend) {
                statusLabel.innerText = "直播状态：非直播日";
                timerDisplay.innerText = "OFF-DUTY";
                timerDisplay.classList.add('is-offday');
                return;
            }
        
            let targetTime = new Date(now);
            targetTime.setHours(11, 59, 59, 0);
            if (now > targetTime) {
                targetTime.setDate(targetTime.getDate() + 1);
                if (targetTime.getDay() === 6) {
                    targetTime.setDate(targetTime.getDate() + 2);
                }
            }
        
            const diff = targetTime - now;
            const hours = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const seconds = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        
            statusLabel.innerText = "Live 慢直播（倒计时）";
            timerDisplay.classList.remove('is-offday');
            timerDisplay.innerText = `${hours}:${minutes}:${seconds}`;
        }
        
        setInterval(updateClockAndCountdown, 1000);
        updateClockAndCountdown();

        // ================= 3. 右侧全平台交互引导逻辑 =================
        const guides = {
            win: '快捷键 <code>Win + R</code> 输入 <code>cmd</code>，以管理员运行并执行：<code>notepad %SystemRoot%\\System32\\drivers\\etc\\hosts</code>，修改后按快捷键 <code>ipconfig /flushdns</code> 刷新 DNS。',
            mac: '打开终端 (Terminal)，运行命令：<code>sudo nano /etc/hosts</code>，编辑完成后按 Ctrl+O 保存，并运行 <code>sudo killall -HUP mDNSResponder</code> 刷新缓存。',
            ios: 'iOS/iPadOS 系统限制不可直接修改，推荐使用 <code>Quantumult X</code>、<code>Loon</code> 或 <code>Shadowrocket</code> 软件的 Local DNS/Hosts 重定向功能。',
            android: 'Android/HarmonyOS 须 Root 权限修改 <code>/system/etc/hosts</code>；非 Root 推荐使用 <code>AdGuard</code> 或 <code>V2rayNG</code> 的 DNS 映射功能。',
            tv: '电视/大屏设备建议在路由器后台（如 OpenWrt/Padavan）的 <code>自定义 DNS / Hosts</code> 处添加，对全局域网大屏设备生效。'
        };

        function switchPlatform(platform, event) {
            document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.getElementById('guide-text').innerHTML = guides[platform];
        }

        switchPlatform('win');

        // ================= 4. 动态解析文本框中的域名并生成 bgp.he.net 链接 =================
        function generateBgpLinks() {
            const hostsText = document.getElementById('hosts-code').value;
            const lines = hostsText.split('\n');
            const domains = new Set();

            lines.forEach(line => {
                line = line.trim();
                if (line && !line.startsWith('#')) {
                    const parts = line.split(/\s+/);
                    if (parts.length >= 2) {
                        const ip = parts[0];
                        const domain = parts[1];
                        if (domain && domain.includes('.') && ip !== '127.0.0.1' && ip !== '0.0.0.0') {
                            domains.add(domain);
                        }
                    }
                }
            });

            const container = document.getElementById('dns-links-container');
            container.innerHTML = '';

            if (domains.size === 0) {
                container.innerHTML = '<span style="font-size: 11px; color: var(--text-sub);">当前面板未检测到可查询的外网域名</span>';
                return;
            }

            domains.forEach(domain => {
                const btn = document.createElement('a');
                btn.className = 'bgp-link-btn';
                btn.href = `https://bgp.he.net/dns/${domain}`;
                btn.target = '_blank';
                btn.innerHTML = `${domain} <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;
                container.appendChild(btn);
            });
        }

        generateBgpLinks();

        function copyHosts() {
            const hostsCode = document.getElementById('hosts-code').value;
            navigator.clipboard.writeText(hostsCode).then(() => {
                alert('当前分类的 Hosts 内容已成功复制到剪贴板！');
            }).catch(err => {
                alert('复制失败，请手动选择复制。');
            });
        }

        function resetDefaultHosts() {
            if(confirm("确定要将当前面板的内容恢复为默认预设吗？")) {
                document.getElementById('hosts-code').value = hostsPresets[currentTabKey];
                generateBgpLinks();
            }
        }
    </script>
</body>
</html>

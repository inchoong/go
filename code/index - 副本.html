	<style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(10, 20, 28, 0.75);
            --border-color: rgba(0, 255, 102, 0.25);
            --primary-neon: #00ff66; /* 黑客帝国经典绿 */
            --secondary-neon: #00f0ff; /* 青蓝辅助色 */
            --live-red: #ff0055;
            --text-main: #f0f4f8;
            --text-sub: #8aa3ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 50px;
            position: relative;
            overflow-x: hidden;
        }

        /* 黑客帝国 Canvas 全屏背景 */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
        }

        /* 左右布局大容器 */
        .container {
            display: flex;
            flex-direction: row;
            gap: 24px;
            width: 100%;
            max-width: 1380px;
            min-height: 700px;
            z-index: 1;
        }

        @media (max-width: 960px) {
            .container {
                flex-direction: column;
            }
        }

        /* 通用卡片科技感玻璃拟态样式 */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-neon), transparent);
        }

        /* ================= 左侧：主播卡片 ================= */
        .streamer-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 380px;
        }

        @media (max-width: 960px) {
            .streamer-card {
                max-width: 100%;
            }
        }

        .profile-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
        }

        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
            width: 88px;
            height: 88px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .live-badge {
            position: absolute;
            top: -6px;
            left: -6px;
            background: var(--live-red);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
            letter-spacing: 1px;
        }

        .breath-dot {
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            animation: breath 1.2s infinite ease-in-out;
        }

        @keyframes breath {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        .profile-info h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }

        .profile-info p {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .tags {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 10px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--primary-neon);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        /* 直播/多媒体播放器样式 */
        .live-player-box {
            margin-top: 16px;
            background: rgba(0, 10, 18, 0.85);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 12px;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .player-title {
            font-size: 12px;
            color: var(--primary-neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toggle-config-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: var(--secondary-neon);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-config-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--secondary-neon);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 确保 GIF 无黑边完整显示 */
        .player-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .audio-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 16px;
            background: radial-gradient(circle, rgba(0,255,102,0.08) 0%, rgba(5,8,17,0.95) 100%);
        }

        .audio-container audio {
            width: 90%;
            outline: none;
            filter: invert(0.9) hue-rotate(80deg);
        }

        .spectrum-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 36px;
            width: 100%;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 255, 102, 0.2);
            border-radius: 6px;
            padding: 6px 12px;
        }

        .audio-spectrum-bar-box {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            height: 50px;
            width: 80%;
        }

        .spectrum-bar {
            flex: 1;
            max-width: 8px;
            background: linear-gradient(to top, var(--primary-neon), var(--secondary-neon));
            border-radius: 2px;
            height: 15%;
            animation: spectrumPulse 1.2s ease-in-out infinite alternate;
        }

        .spectrum-bar:nth-child(1)  { animation-delay: 0.1s; animation-duration: 0.8s; }
        .spectrum-bar:nth-child(2)  { animation-delay: 0.4s; animation-duration: 1.1s; }
        .spectrum-bar:nth-child(3)  { animation-delay: 0.2s; animation-duration: 0.9s; }
        .spectrum-bar:nth-child(4)  { animation-delay: 0.6s; animation-duration: 1.3s; }
        .spectrum-bar:nth-child(5)  { animation-delay: 0.3s; animation-duration: 0.7s; }
        .spectrum-bar:nth-child(6)  { animation-delay: 0.5s; animation-duration: 1.0s; }
        .spectrum-bar:nth-child(7)  { animation-delay: 0.2s; animation-duration: 1.2s; }
        .spectrum-bar:nth-child(8)  { animation-delay: 0.7s; animation-duration: 0.8s; }
        .spectrum-bar:nth-child(9)  { animation-delay: 0.1s; animation-duration: 1.1s; }
        .spectrum-bar:nth-child(10) { animation-delay: 0.4s; animation-duration: 0.9s; }

        @keyframes spectrumPulse {
            0% { height: 10%; opacity: 0.3; }
            100% { height: 100%; opacity: 1; }
        }

        .player-controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 11px;
            transition: all 0.4s ease-in-out;
            overflow: hidden;
        }

        .player-controls.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            padding: 0;
            pointer-events: none;
        }

        .player-controls.expanded {
            max-height: 300px;
            opacity: 1;
        }

        .control-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .control-row label {
            color: var(--text-sub);
            width: 50px;
            flex-shrink: 0;
        }

        .control-input, .control-select {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 102, 0.25);
            border-radius: 4px;
            color: var(--primary-neon);
            padding: 4px 8px;
            font-size: 11px;
            outline: none;
            font-family: monospace;
        }

        .control-input:focus, .control-select:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
        }

        .apply-btn {
            background: linear-gradient(135deg, rgba(0,255,102,0.2) 0%, rgba(0,240,255,0.2) 100%);
            border: 1px solid var(--primary-neon);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .apply-btn:hover {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .status-bar {
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
		
		/* 励志语录卡片样式 */
		.quote-box {
		    margin-top: 16px;
		    background: rgba(0, 0, 0, 0.4);
		    border: 1px solid rgba(0, 255, 102, 0.2);
		    border-radius: 12px;
		    padding: 12px 16px;
		    text-align: center;
		    position: relative;
		    box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.05);
		}
		
		.quote-title {
		    font-size: 10px;

		    letter-spacing: 1px;
		    margin-bottom: 6px;

		.quote-text {
		    font-size: 12px;
		    color: var(--text-main);
		    line-height: 1.5;
		    font-style: italic;
		    transition: opacity 0.5s ease-in-out;
		}

        .real-time-clock {
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(0, 255, 102, 0.2);
        }

        .clock-date {
            font-size: 11px;
            color: var(--secondary-neon);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .clock-time {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-neon);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .status-header {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .countdown-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            color: var(--secondary-neon);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .is-offday {
            color: var(--live-red) !important;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4) !important;
        }

        .beta-link {
            background: #e74c3c;
            color: white;
            padding: 1.5px 8px;
            border-radius: 12px;
            font-size: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .beta-link:hover {
            background: #c0392b;
        }

        /* ================= 右侧：全新代码编辑器与实时运行预览面板 ================= */
        .editor-card {
            flex: 2;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .tabs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
            padding-bottom: 10px;
        }

        .main-tabs {
            display: flex;
            gap: 10px;
        }

        .main-tab-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 102, 0.2);
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;

        }

        .main-tab-btn.active {
            background: linear-gradient(135deg, rgba(0,255,102,0.2) 0%, rgba(0,240,255,0.2) 100%);
            border-color: var(--primary-neon);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }

        .main-tab-btn:hover:not(.active) {
            border-color: var(--secondary-neon);
            color: var(--secondary-neon);
        }

        .typing-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .typing-status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--secondary-neon);
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--primary-neon);
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.typing {
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .action-tool-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: var(--primary-neon);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-tool-btn:hover {
            background: var(--primary-neon);
            color: #000;
        }

        /* 标签页内容容器 */
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 500px;
        }

        .tab-content.active {
            display: flex;
        }

        /* 可视化代码编辑器 (支持高亮渲染与可编辑编辑框叠加) */
        .code-editor-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: rgba(5, 10, 18, 0.9);
            border: 1px solid rgba(0, 255, 102, 0.25);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-top-bar {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
        }

        .editor-area-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        /* 精确对齐重叠层: textarea 负责输入, pre/code 负责高亮显示 */
        .code-textarea, .code-highlight-pre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 14px;
            font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            tab-size: 4;
            white-space: pre;
            word-wrap: normal;
            overflow: auto;
            border: none;
            outline: none;
            box-sizing: border-box;
        }

        .code-textarea {
            color: transparent;
            background: transparent;
            caret-color: var(--primary-neon);
            z-index: 2;
            resize: none;
        }

        .code-highlight-pre {
            z-index: 1;
            pointer-events: none;
            background: transparent !important;
        }

        .code-highlight-pre code {
            font-family: inherit !important;
            font-size: inherit !important;
            background: transparent !important;
        }

        /* 运行预览 Iframe 样式 */
        .preview-frame {
            width: 100%;
            flex: 1;
            min-height: 500px;
            background: #ffffff;
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 8px;
        }

        /* 底部操作按钮栏 */
        .editor-bottom-bar {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const matrixChars = "ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ1234567890ABCDEFGHJKLMNPQRSTUVWXYZ";
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        initDrops();
        window.addEventListener('resize', initDrops);

        function drawMatrix() {
            ctx.fillStyle = "rgba(5, 8, 17, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                if (Math.random() > 0.85) {
                    ctx.fillStyle = "#ffffff";
                } else if (Math.random() > 0.5) {
                    ctx.fillStyle = "#00ff66";
                } else {
                    ctx.fillStyle = "#00b347";
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

            if (flvPlayer) { flvPlayer.destroy(); flvPlayer = null; }

            if (type === 'flv') {
                if (flvjs.isSupported()) {
                    flvPlayer = flvjs.createPlayer({ type: 'flv', isLive: true, url: url });
                    flvPlayer.attachMediaElement(video);

            } else if (type === 'hls') {

        // ================= 2. 倒计时与实时时钟逻辑 =================
        function updateClockAndCountdown() {
            const now = new Date();
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            let dateStr = now.toLocaleDateString('zh-CN', dateOptions);
            dateStr = dateStr.replace(/星期(.?)/, '（周$1）');
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
        
            document.getElementById('clock-date').innerText = dateStr;
            document.getElementById('clock-time').innerText = timeStr;
        
            const dayOfWeek = now.getDay();
            const statusLabel = document.getElementById('status-label');
            const timerDisplay = document.getElementById('countdown-timer');
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        
            if (isWeekend) {
                statusLabel.innerText = "直播状态：非直播日";
                timerDisplay.innerText = "OFF-DUTY";
                timerDisplay.classList.add('is-offday');
                return;
            }
        
            let targetTime = new Date(now);
            targetTime.setHours(11, 59, 59, 0);
            if (now > targetTime) {
                targetTime.setDate(targetTime.getDate() + 1);
                if (targetTime.getDay() === 6) targetTime.setDate(targetTime.getDate() + 2);
            }
        
            const diff = targetTime - now;
            const hours = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const seconds = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        
            statusLabel.innerText = "Live 慢直播（倒计时）";
            timerDisplay.classList.remove('is-offday');
            timerDisplay.innerText = `${hours}:${minutes}:${seconds}`;
        }

        updateClockAndCountdown();

            }
        }

        // 同步输入框内容到高亮层
        const textarea = document.getElementById('sourceCodeInput');
        const highlightCode = document.getElementById('highlightCode');
        const highlightPre = document.getElementById('highlightPre');

        function syncCodeHighlight() {
            const val = textarea.value;
            highlightCode.textContent = val;
            Prism.highlightElement(highlightCode);

            // 同步滚动位置
            highlightPre.scrollTop = textarea.scrollTop;
            highlightPre.scrollLeft = textarea.scrollLeft;
        }

        textarea.addEventListener('scroll', () => {
            highlightPre.scrollTop = textarea.scrollTop;
            highlightPre.scrollLeft = textarea.scrollLeft;
        });

        // 多项目预设代码（打字机循环展示）
        const demoProjects = [
            {
                name: "项目 [1/3]: 正在输出当前页面完整源码...",
                code: `<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #050811; color: #00ff66; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { border: 1px solid #00ff66; border-radius: 12px; display: inline-block; padding: 20px; box-shadow: 0 0 15px rgba(0,255,102,0.3); }
        h1 { color: #00f0ff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello! 乐哥创事记</h1>
        <p>这是当前页面编辑器的实时运行预览组件。</p>
        <button onclick="alert('运行正常！')">点击测试</button>
    </div>
</body>
</html>`
            },
            {
                name: "项目 [2/3]: 3D 科技感粒子时钟演示...",
                code: `<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #00f0ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: monospace; }
        .clock { font-size: 48px; border: 2px dashed #00ff66; padding: 20px 40px; border-radius: 10px; text-shadow: 0 0 10px #00ff66; }
    </style>
</head>
<body>
    <div class="clock" id="clk">00:00:00</div>
    <script>
        setInterval(() => {
            document.getElementById('clk').innerText = new Date().toLocaleTimeString();
        }, 1000);
    <\/script>
</body>
</html>`
            },
            {
                name: "项目 [3/3]: MarkDown 实时渲染卡片...",
                code: `<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #111; color: #fff; padding: 30px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        h2 { color: #00ff66; border-bottom: 1px solid #333; padding-bottom: 8px; }
        ul { color: #00f0ff; line-height: 1.8; }
    </style>
</head>
<body>
    <h2>🚀 极客工具链与技术栈</h2>
    <ul>
        <li><b>网络架构:</b> BGP HE.NET IP 智能映射</li>
        <li><b>流媒体支持:</b> FLV / HLS / AAC 实时预览</li>
        <li><b>前端引擎:</b> Webpack + Prism.js 语法高亮</li>
    </ul>
</body>
</html>`
            }
        ];

        let currentProjectIndex = 0;
        let charIndex = 0;
        let isTyping = true;
        let typingTimer = null;

        function typeWriterStep() {
            if (!isTyping) return;

            const targetProject = demoProjects[currentProjectIndex];
            document.getElementById('projectIndicator').innerText = targetProject.name;

            if (charIndex < targetProject.code.length) {
                // 按块输入提高模拟流畅度
                const chunk = targetProject.code.slice(charIndex, charIndex + 3);
                textarea.value += chunk;
                charIndex += 3;
                syncCodeHighlight();
                
                // 自动向下滚动
                textarea.scrollTop = textarea.scrollHeight;
                highlightPre.scrollTop = highlightPre.scrollHeight;

                typingTimer = setTimeout(typeWriterStep, 35);
            } else {
                // 当前项目写完，停顿 6 秒后进入下一个项目
                typingTimer = setTimeout(() => {
                    if (!isTyping) return;
                    textarea.value = '';
                    charIndex = 0;
                    currentProjectIndex = (currentProjectIndex + 1) % demoProjects.length;
                    typeWriterStep();
                }, 6000);
            }
        }

        // 启动自动打字演示
        typeWriterStep();

        // 切换/暂停打字模式
        function toggleAutoTyping() {
            isTyping = !isTyping;
            const btn = document.getElementById('toggleTypingBtn');
            const dot = document.getElementById('typeDot');
            const statusText = document.getElementById('typeStatusText');

            if (isTyping) {
                btn.innerText = "暂停演示";
                dot.classList.add('typing');
                statusText.innerText = "自动演示打字中...";
                typeWriterStep();
            } else {
                btn.innerText = "继续编程";
                dot.classList.remove('typing');
                statusText.innerText = "已暂停 (自由编程)";
                if (typingTimer) clearTimeout(typingTimer);
            }
        }

        // 用户人工输入时自动暂停打字机
        textarea.addEventListener('keydown', () => {
            if (isTyping) {
                toggleAutoTyping();
            }
        });

        // 运行当前代码并在 Preview 选项卡渲染
        function runCodeAndPreview() {
            const code = textarea.value;
            const iframe = document.getElementById('appPreviewFrame');
            iframe.srcdoc = code;
            
            // 如果是在编辑页触发，自动切到预览页
            const previewTabActive = document.getElementById('tab-preview').classList.contains('active');
            if (!previewTabActive) {
                switchMainTab('preview');
            }
        }

        function refreshPreview() {
            runCodeAndPreview();
        }

        function copyCurrentCode() {
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert('代码已成功复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请手动选择复制。');
            });
        }

        function downloadCodeFile() {
            const blob = new Blob([textarea.value], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code-snippet-${Date.now()}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                if (isTyping) toggleAutoTyping();
                textarea.value = e.target.result;
                syncCodeHighlight();
                alert(`已成功导入文件: ${file.name}`);
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>

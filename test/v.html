<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style>
		.video-wrapper {
		  position: relative;
		  max-width: 1280px;
		  margin: 0 auto;
		  background: #000;
		}
		
		.video-container {
		  position: relative;
		  width: 100%;
		  padding-bottom: 56.25%; /* 16:9比例 */
		}
		
		#main-video {
		  position: absolute;
		  width: 100%;
		  height: 100%;
		  object-fit: cover;
		  border-radius: 8px;
		  transition: all 0.3s ease;
		}
		
		/* 预览图悬停效果 */
		#main-video:hover {
		  transform: scale(1.02);
		  box-shadow: 0 12px 24px rgba(0,0,0,0.2);
		}
		
		/* 时间显示样式 */
		.video-time {
		  position: absolute;
		  top: 15px;
		  left: 15px;
		  background: rgba(0,0,0,0.7);
		  color: #fff;
		  padding: 5px 10px;
		  border-radius: 4px;
		  font-family: Arial, sans-serif;
		  z-index: 2;
		}
		
		/* 标题和链接样式 */
		.video-header {
		  position: absolute;
		  top: 60px;
		  left: 15px;
		  z-index: 2;
		  max-width: 60%;
		}
		
		.video-link {
		  text-decoration: none;
		  color: #fff;
		  display: flex;
		  align-items: center;
		  gap: 10px;
		}
		
		.video-title {
		  font-size: 1.2rem;
		  font-weight: 500;
		  max-width: 300px;
		  white-space: nowrap;
		  overflow: hidden;
		  text-overflow: ellipsis;
		}
		
		/* Logo样式 */
		.logo-link {
		  position: absolute;
		  bottom: 15px;
		  right: 15px;
		  z-index: 2;
		}
		
		.video-logo {
		  width: 40px;
		  height: 40px;
		  transition: opacity 0.3s ease;
		}
		
		.logo-link:hover .video-logo {
		  opacity: 0.8;
		}
		
		/* 分享按钮样式 */
		.share-button {
		  position: absolute;
		  top: 15px;
		  right: 15px;
		  z-index: 2;
		  background: rgba(255,255,255,0.1);
		  border-radius: 50%;
		  width: 40px;
		  height: 40px;
		  display: flex;
		  align-items: center;
		  justify-content: center;
		  cursor: pointer;
		  transition: all 0.3s ease;
		}
		
		.share-button:hover {
		  background: rgba(255,255,255,0.2);
		  transform: scale(1.1);
		}
		
		/* 移动端适配 */
		@media (max-width: 768px) {
		  .video-header {
		    top: 10px;
		    max-width: 70%;
		  }
		  
		  .video-title {
		    font-size: 1rem;
		  }
		  
		  .logo-link {
		    width: 35px;
		    height: 35px;
		  }
		  
		  .share-button {
		    width: 35px;
		    height: 35px;
		  }
		}
		</style>
	</head>
	
	<body>
		<div class="video-wrapper">
		  <!-- 视频容器 -->
		  <div class="video-container">
		    <video id="main-video" controls poster="thumbnail.jpg">
		      <source src="https://v3-web-prime.douyinvod.com/video/tos/cn/tos-cn-ve-15/o0POhIA1G5Uja0WBOIQEliT82qoUDa2PrXKAi/?a=6383&ch=224&cr=3&dr=0&lr=all&cd=0%7C0%7C0%7C3&cv=1&br=1594&bt=1594&cs=0&ds=4&ft=4IXgKqDMffPdqK~-I13NvAq-antLjrKcHGRCRkamQlzRejVhWL6&mime_type=video_mp4&qs=0&rc=aTVmaTVmMzozO2QzaGhnOkBpam5yZ3M5cjlzNTMzNGkzM0AxYzQwYi8xNTIxXjIuLTAwYSNpM2pyMmQ0YmZhLS1kLWFzcw%3D%3D&btag=80000e00038000&cquery=100K_100o_101x_100B_100H&dy_q=1758007933&expire=1758020229&feature_id=0ea98fd3bdc3c6c14a3d0804cc272721&l=20250916153213F445F2F8047277E84B90&ply_type=4&policy=4&signature=0f65208d1c357b9c4421d0155f27bc2f&tk=webid&__vid=7540606917836574006&webid=a0ab33eaf22428957f475f626977b173f94957c7849b046cc7f9250ce13f2ce8b4d14f9b9894fb9c748fd6f45c271e9a7c3eb826c10a890f447298a0e7e0a796499e5e885c8c58d538da76648887b25fc16193998224d7fe3873abfb1a8f43c8ea00a28aecf099b69ae23b15c08ceb95a9ceffdb0b0ee8b048b049be0ee73bfe9e415192e10585644e660d40597fbf30840c389918f87b2211ae57ce6935b4a6-d662c6d1a010c114fff58c97ff0123cc&fid=43b326ebfea26feb5c401ccdcb964c59" type="video/mp4">
		      Your browser does not support HTML5 video.
		    </video>
		    
		    
		    
		    <!-- 标题和链接 -->
		    <div class="video-header">
		      <a href="https://example.com" class="video-link">
		        <h2 class="video-title">视频标题示例</h2>
		      </a>
		    </div>
		    
		    <!-- 右下角Logo -->		 
			<a href="https://www.cctv.com/" target="_blank" class="logo-link">
			    <img src="https://p1.img.cctvpic.com/photoAlbum/templet/common/DEPA1652643499621200/logo.png" alt="Logo" title="央视网_世界就在眼前" class="video-logo">
			</a>
		    <!-- 加载状态时间显示 -->
		    <div class="video-time">00:00:00</div>
			
		    <!-- 右上角分享按钮 -->
		    <div class="share-button">				
		      <img src="share-icon.png" alt="分享" style="vertical-align:text-bottom;width: 15px; height: 15px;" >
		    </div>
		  </div>
		</div>
		
		
		
		<script>
		// 实时北京时间显示
		function updateTime() {
		  const videoTime = document.querySelector('.video-time');
		  const now = new Date();
		  
		  // 北京时间计算（UTC+8）
		  const beijingTime = new Date(now.getTime() + 8 * 60 * 60 * 1000);
		  
		  const hours = String(beijingTime.getHours()).padStart(2, '0');
		  const minutes = String(beijingTime.getMinutes()).padStart(2, '0');
		  const seconds = String(beijingTime.getSeconds()).padStart(2, '0');
		  
		  videoTime.textContent = `${hours}:${minutes}:${seconds}`;
		}
		
		// 初始化时间更新
		setInterval(updateTime, 1000);
		updateTime();
		</script>
	</body>
</html>

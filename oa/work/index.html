  <!-- /* 使用javascript中Date对象创建获取时间,使用一个div标签来显示获取当前时间的值 */ -->	
  	<script type="text/javascript">	
  	window.onload=function()	
  	{	
  	window.requestAnimationFrame(getDate)	
  	}	
  	function getDate()	
  	{	
  	window.setTimeout(function(){	
  	window.requestAnimationFrame(getDate)	
  	},1000/2)	
  	var d=new Date();   	
  	var year=d.getFullYear()  //获取年	
  	var month=d.getMonth()+1;  //获取月，从 Date 对象返回月份 (0 ~ 11)，故在此处+1	
  	var day=d.getDay()    //获取日	
  	var days=d.getDate() //获取日期	
  	var hour=d.getHours()   //获取小时	
  	var minute=d.getMinutes()  //获取分钟	
  	var second=d.getSeconds()   //获取秒	
  	if(month<10) month="0"+month	
  	if(days<10) days="0"+days	
  	if(hour<10) hour="0"+hour	
  	if(minute<10) minute="0"+minute	
  	if(second<10) second="0"+second	
  	var week=new Array("周日","周一","周二","周三","周四","周五","周六")	
  	var Tools=document.getElementById("Main")	
  	var da=year+"/"+month+"/"+days+"&nbsp;"+week[day]+hour+":"+minute+":"+second	
  	Tools.innerHTML=da	
  	}	
  	</script> 	<!-- /* 使用javascript中Date对象创建获取时间,使用一个div标签来显示获取当前时间的值 */ -->

  			</div>
			
  <!-- JavaScript -->
  <script>
    const countdownElement = document.getElementById("countdown");
    const deadline = new Date("2025-05-10T12:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = deadline - now;

      if (distance <= 0) {
        countdownElement.innerHTML = '<span class="expired">二维码已过期</span>';
        clearInterval(interval);
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.textContent = `剩余时间：${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
    }

    const interval = setInterval(updateCountdown, 1000);
    updateCountdown(); // 初次执行
  </script>

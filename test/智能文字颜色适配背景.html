<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>智能文字颜色适配背景</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }

    .hero-section {
      position: relative;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .hero-slide {
      position: relative;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    /* 柔化遮罩层：统一背景对比度 */
    .hero-slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.3),
        rgba(0, 0, 0, 0.7)
      );
      opacity: 0.9;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 80%;
    }

    /* 智能标题样式：柔和白色，带阴影 */
    .hero-title {
      font-size: 2.2rem;
      font-weight: 600;
      color: white;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.5),
        0 1px 1px rgba(0, 0, 0, 0.3);
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    /* 链接反色显示：根据背景自动选择深/浅色 */
    .hero-link {
      display: inline-block;
      padding: 0.8em 1.5em;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s ease;
      /* 使用 mix-blend-mode 让文字“穿透”背景，自动反色 */
      mix-blend-mode: difference;
      /* 或使用滤镜反色（备用方案） */
      /* filter: invert(1) contrast(1.2); */
    }

    .hero-link:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 1.6rem;
      }
      .hero-link {
        font-size: 0.95rem;
        padding: 0.6em 1.2em;
      }
    }
  </style>
</head>
<body>

  <!-- 示例 1：深色背景图片 -->
  <div class="hero-section">
    <div class="hero-slide" style="background-image: url('https://via.placeholder.com/1200x600/1a1a1a/cccccc?text=深色背景')">
      <div class="hero-content">
        <h2 class="hero-title">这是一段在深色背景上的标题</h2>
        <a href="#" class="hero-link">了解更多</a>
      </div>
    </div>
  </div>

  <!-- 示例 2：浅色背景图片 -->
  <div class="hero-section">
    <div class="hero-slide" style="background-image: url('https://via.placeholder.com/1200x600/f8f8f8/333333?text=浅色背景')">
      <div class="hero-content">
        <h2 class="hero-title">这是一段在浅色背景上的标题</h2>
        <a href="#" class="hero-link">了解更多</a>
      </div>
    </div>
  </div>

  <!-- 示例 3：中性色背景 -->
  <div class="hero-section">
    <div class="hero-slide" style="background-image: url('https://via.placeholder.com/1200x600/888888/eeeeee?text=中性背景')">
      <div class="hero-content">
        <h2 class="hero-title">这是一段在中性背景上的标题</h2>
        <a href="#" class="hero-link">了解更多</a>
      </div>
    </div>
  </div>

</body>
</html>
